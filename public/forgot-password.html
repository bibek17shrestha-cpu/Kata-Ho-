<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — कता हो?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="topbar" id="nav"></nav>
<div class="wrap-narrow">
  <div class="card-box">
    <h2>Forgot your password?</h2>
    <p class="sub" style="margin-top:6px;">Enter your account email and we'll send a reset link.</p>
    <label for="fEmail">Email</label>
    <input id="fEmail" type="email" placeholder="you@example.com">
    <div class="err" id="formErr"></div>
    <div class="ok" id="formOk" style="display:none;"></div>
    <button class="btn-primary" id="submitBtn" style="width:100%; margin-top:18px;">Send reset link</button>
    <p class="sub" style="margin-top:14px; font-size:13.5px;"><a href="/login.html">Back to log in</a></p>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(async function(){
  const user = await getMe();
  renderNav(user);
})();

document.getElementById('submitBtn').addEventListener('click', async () => {
  const email = document.getElementById('fEmail').value.trim();
  const errEl = document.getElementById('formErr');
  const okEl = document.getElementById('formOk');
  errEl.textContent = ''; okEl.style.display = 'none';
  if (!email) { errEl.textContent = 'Enter your email.'; return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const res = await fetch('/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    okEl.textContent = data.message || 'If that email has an account, a reset link has been sent.';
    okEl.style.display = 'block';
    document.getElementById('fEmail').value = '';
  } catch (e) {
    errEl.textContent = e.message;
  }
  btn.disabled = false; btn.textContent = 'Send reset link';
});
</script>
</body>
</html>
