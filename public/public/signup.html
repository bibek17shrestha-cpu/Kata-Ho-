<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — कता हो?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="topbar" id="nav"></nav>
<div class="wrap-narrow">
  <div class="card-box">
    <h2>Create your account</h2>
    <p class="sub" style="margin-top:6px;">Pick your role. This can't be changed later, so choose the one that matches how you'll use the board.</p>

    <div class="role-toggle" style="margin-top:16px;">
      <button id="roleRider" type="button" class="sel">I drive<small>Post spare seats, set availability, accept ride requests</small></button>
      <button id="roleConsumer" type="button">I need rides<small>Browse drivers &amp; request a ride</small></button>
    </div>

    <label for="fName">Name</label>
    <input id="fName" placeholder="e.g. Bless">

    <label for="fEmail">Email</label>
    <input id="fEmail" type="email" placeholder="you@example.com">

    <label for="fContact">Contact (phone, WhatsApp, etc.)</label>
    <input id="fContact" placeholder="Shown to whoever you're matched with">

    <label for="fGender">Gender</label>
    <select id="fGender">
      <option value="unspecified">Prefer not to say</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>

    <label for="fPassword">Password</label>
    <input id="fPassword" type="password" placeholder="At least 6 characters">

    <div class="err" id="formErr"></div>

    <button class="btn-primary" id="submitBtn" style="width:100%; margin-top:18px;">Create account</button>
    <p class="sub" style="margin-top:14px; font-size:13.5px;">Already have an account? <a href="/login.html">Log in</a></p>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(async function(){
  const user = await getMe();
  renderNav(user);
  if (user) window.location.href = user.role === 'rider' ? '/rider.html' : '/consumer.html';
})();

let role = 'rider';
document.getElementById('roleRider').addEventListener('click', () => setRole('rider'));
document.getElementById('roleConsumer').addEventListener('click', () => setRole('consumer'));
function setRole(r){
  role = r;
  document.getElementById('roleRider').classList.toggle('sel', r === 'rider');
  document.getElementById('roleConsumer').classList.toggle('sel', r === 'consumer');
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const name = document.getElementById('fName').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  const contact = document.getElementById('fContact').value.trim();
  const gender = document.getElementById('fGender').value;
  const password = document.getElementById('fPassword').value;
  const errEl = document.getElementById('formErr');
  errEl.textContent = '';

  if (!name || !email || !contact || !password) {
    errEl.textContent = 'Please fill in every field.';
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const res = await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, role, contact, gender })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    window.location.href = role === 'rider' ? '/rider.html' : '/consumer.html';
  } catch (e) {
    errEl.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
