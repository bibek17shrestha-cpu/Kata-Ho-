<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — कता हो?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="topbar" id="nav"></nav>
<div class="wrap-narrow">
  <div class="card-box">
    <h2>Set a new password</h2>
    <div id="formArea">
      <label for="fPassword">New password</label>
      <input id="fPassword" type="password" placeholder="At least 6 characters">
      <label for="fPassword2">Confirm new password</label>
      <input id="fPassword2" type="password" placeholder="Type it again">
      <div class="err" id="formErr"></div>
      <button class="btn-primary" id="submitBtn" style="width:100%; margin-top:18px;">Set new password</button>
    </div>
    <div id="successArea" style="display:none;">
      <p class="sub">Your password has been reset. You can log in now.</p>
      <a class="btn-primary" style="display:inline-block; text-decoration:none; margin-top:8px;" href="/login.html">Go to log in</a>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script>
(async function(){
  const user = await getMe();
  renderNav(user);
})();

const params = new URLSearchParams(window.location.search);
const token = params.get('token');
if (!token) {
  document.getElementById('formErr').textContent = 'This reset link is missing its token. Request a new one from the forgot password page.';
  document.getElementById('submitBtn').disabled = true;
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const password = document.getElementById('fPassword').value;
  const password2 = document.getElementById('fPassword2').value;
  const errEl = document.getElementById('formErr');
  errEl.textContent = '';

  if (!password || password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; return; }
  if (password !== password2) { errEl.textContent = "Passwords don't match."; return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    document.getElementById('formArea').style.display = 'none';
    document.getElementById('successArea').style.display = 'block';
  } catch (e) {
    errEl.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Set new password';
  }
});
</script>
</body>
</html>
